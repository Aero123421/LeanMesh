# Thin wrapper: all logic is in scripts/build_targets.sh. NOT EXECUTED in T01 (no GitHub runner here).
# The container tag is an assumption; the script itself refuses an IDF HEAD that differs from
# the pin in config/dependencies.json.
name: build-targets
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-24.04
    container: espressif/idf:v6.0.3
    steps:
      - uses: actions/checkout@v4
        with: { submodules: false }
      - run: git config --global --add safe.directory '*'
      - run: scripts/third_party.sh setup
      - run: scripts/third_party.sh verify
      - run: IDF_PATH=/opt/esp/idf scripts/build_targets.sh
